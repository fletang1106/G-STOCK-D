<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GESTION DE STOCK DEKA</title>
<style>
:root{--blue:#0757a5;--dark:#07366c;--bg:#f2f5fa;--line:#dce4ee;--text:#243447}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
header{background:linear-gradient(120deg,var(--dark),#087bd1);color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:21px;margin:0}button{border:0;border-radius:7px;background:var(--blue);color:white;padding:10px 14px;cursor:pointer;font-weight:600}button.secondary{background:#64748b}button.danger{background:#b42318}button:disabled{opacity:.5}
main{max-width:1250px;margin:20px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #18324b0a}
.login{max-width:420px;margin:8vh auto}.hidden{display:none!important}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button{background:#e4edf7;color:#17436e}.nav button.active{background:var(--blue);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#f4f8fc;border:1px solid var(--line);padding:15px;border-radius:10px}.metric strong{display:block;font-size:25px;color:var(--dark);margin-top:7px}
form .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;background:white}textarea{min-height:70px}form button{margin-top:13px}
h2{font-size:19px;margin:0 0 14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f4f7fb}.muted{color:#64748b;font-size:13px}.error{color:#b42318;margin:10px 0}.success{color:#087443;margin:10px 0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:600px){header h1{font-size:18px}.panel{padding:13px}.nav button{flex:1 1 42%}}
</style></head>
<body>
<header><h1>GESTION DE STOCK DEKA</h1><div id="userbar" class="hidden"><span id="who"></span> <button class="secondary" onclick="logout()">Déconnexion</button></div></header>
<main>
<section id="login" class="panel login"><h2>Connexion DEKA</h2><form id="loginForm"><label>Email</label><input name="email" type="email" required autocomplete="username"><label style="margin-top:10px">Mot de passe</label><input name="password" type="password" required autocomplete="current-password"><button type="submit">Se connecter</button><div id="loginMsg" class="error"></div></form><p class="muted">Le compte administrateur initial est défini dans les variables d'environnement Vercel.</p></section>
<section id="app" class="hidden">
<nav class="nav" id="nav"></nav>
<div id="message"></div>
<section id="view"></section>
</section></main>
<script>
const state={user:null,resource:"dashboard",data:{},products:[],clients:[],depots:[]};
const labels={dashboard:"Tableau de bord",produits:"Liste Produits",clients:"Liste Clients",depots:"Dépôts",entrees:"Entrées",sorties:"Sorties",inventaire:"Inventaire",ajustements:"Régularisation",historique:"Historique",rapports:"Rapports",utilisateurs:"Utilisateurs"};
const adminOnly=["inventaire","ajustements","historique","rapports","utilisateurs"];
const api=async(path,opts={})=>{const r=await fetch("/api/"+path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Erreur");return d};
const isAdmin=()=>["admin","administrateur"].includes(String(state.user?.role||"").toLowerCase());
const msg=(t,ok=false)=>{document.getElementById("message").innerHTML=`<div class="${ok?"success":"error"}">${esc(t)}</div>`;setTimeout(()=>document.getElementById("message").innerHTML="",5000)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
async function login(e){e.preventDefault();const f=new FormData(e.target);try{const d=await api("auth",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});state.user=d.user;await startApp()}catch(err){document.getElementById("loginMsg").textContent=err.message}}
async function logout(){await api("logout",{method:"POST"}).catch(()=>{});state.user=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");document.getElementById("userbar").classList.add("hidden")}
async function startApp(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("userbar").classList.remove("hidden");document.getElementById("who").textContent=state.user.nom+" ("+state.user.role+")";buildNav();await refreshBasics();await page("dashboard")}
function buildNav(){const items=["dashboard","produits","clients","depots","entrees","sorties","inventaire","ajustements","historique","rapports","utilisateurs"];document.getElementById("nav").innerHTML=items.filter(x=>!adminOnly.includes(x)||isAdmin()).map(x=>`<button data-page="${x}" onclick="page('${x}')">${labels[x]}</button>`).join("")}
async function refreshBasics(){for(const r of ["produits","clients","depots"]){try{state.data[r]=await api(r)}catch(e){state.data[r]=[]}}state.products=state.data.produits||[];state.clients=state.data.clients||[];state.depots=state.data.depots||[]}
function options(items){return items.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join("")}
async function page(p){if(adminOnly.includes(p)&&!isAdmin())return msg("Accès réservé à l'administrateur.");state.resource=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));const v=document.getElementById("view");try{
 if(p==="dashboard"){await refreshBasics();const [en,so]=await Promise.all([api("entrees"),api("sorties")]);const total=state.products.reduce((a,x)=>a+Number(x.quantite_stock||0),0);v.innerHTML=`<div class="panel"><h2>Tableau de bord</h2><div class="grid"><div class="metric">Total Produits<strong>${state.products.length}</strong></div><div class="metric">Total Entrées<strong>${en.length}</strong></div><div class="metric">Total Sorties<strong>${so.length}</strong></div><div class="metric">Stock disponible<strong>${total}</strong></div><div class="metric">Clients<strong>${state.clients.length}</strong></div></div></div><div class="panel"><h2>Stock par produit</h2>${table(state.products,["reference","nom","depot","quantite_stock","stock_minimum","unite"])}</div>`;return}
 if(p==="produits"){await refreshBasics();v.innerHTML=`<div class="panel"><h2>Ajouter un produit</h2>${productForm()}</div>${listPanel("Produits",state.products,["reference","nom","categorie","depot","quantite_stock","stock_minimum","unite"],"produits")}`;return}
 if(p==="clients"){await refreshBasics();v.innerHTML=`<div class="panel"><h2>Ajouter un client</h2>${simpleForm("clients",["nom","telephone","adresse"])}</div>${listPanel("Clients",state.clients,["nom","telephone","adresse"],"clients")}`;return}
 if(p==="depots"){await refreshBasics();v.innerHTML=`<div class="panel"><h2>Ajouter un dépôt</h2>${simpleForm("depots",["nom","adresse","responsable"])}</div>${listPanel("Dépôts",state.depots,["nom","adresse","responsable"],"depots")}`;return}
 if(p==="entrees"){await refreshBasics();const rows=await api("entrees");v.innerHTML=`<div class="panel"><h2>Entrée de marchandises</h2>${entryForm()}</div>${listPanel("Historique des entrées",rows,["date_entree","produit_id","reference_document","depot","quantite","fournisseur","date_expiration"],"entrees")}`;return}
 if(p==="sorties"){await refreshBasics();const rows=await api("sorties");v.innerHTML=`<div class="panel"><h2>Sortie de marchandises</h2>${exitForm()}</div>${listPanel("Historique des sorties",rows,["date_sortie","produit_id","numero_facture","quantite","avance","balance","client_destinataire","depot","chauffeur","plaque","numero_bon_livraison","telephone_chauffeur"],"sorties")}`;return}
 if(p==="inventaire"){await refreshBasics();v.innerHTML=`<div class="panel"><h2>Inventaire actuel</h2>${table(state.products,["reference","nom","depot","quantite_stock","unite"])}</div>`;return}
 if(p==="ajustements"){const [rows,products]=await Promise.all([api("ajustements"),api("produits")]);state.products=products;v.innerHTML=`<div class="panel"><h2>Régularisation du stock</h2><form onsubmit="submitForm(event,'ajustements')"><div class="fields"><div><label>Produit</label><select name="produit_id" required>${options(products)}</select></div><div><label>Nouvelle quantité</label><input name="quantite_apres" type="number" min="0" step="0.01" required></div><div><label>Motif</label><input name="motif" required></div><div><label>Observations</label><input name="observations"></div></div><button>Enregistrer</button></form></div>${listPanel("Historique des régularisations",rows,["produit_id","quantite_avant","quantite_apres","motif","observations"],"ajustements")}`;return}
 if(p==="historique"){const [en,so,aj]=await Promise.all([api("entrees"),api("sorties"),api("ajustements")]);v.innerHTML=`<div class="panel"><h2>Historique général</h2><h3>Entrées</h3>${table(en,["date_entree","produit_id","depot","quantite","fournisseur","reference_document"])}<h3>Sorties</h3>${table(so,["date_sortie","produit_id","depot","quantite","avance","balance","client_destinataire"])}<h3>Régularisations</h3>${table(aj,["produit_id","quantite_avant","quantite_apres","motif","created_at"])}</div>`;return}
 if(p==="rapports"){const [en,so,prod]=await Promise.all([api("entrees"),api("sorties"),api("produits")]);v.innerHTML=`<div class="panel"><h2>Rapports</h2><p>Produits : ${prod.length} | Entrées : ${en.length} | Sorties : ${so.length}</p><button onclick="window.print()">Imprimer / PDF</button></div>`;return}
 if(p==="utilisateurs"){const rows=await api("utilisateurs");v.innerHTML=`<div class="panel"><h2>Créer un utilisateur</h2><form onsubmit="submitForm(event,'utilisateurs')"><div class="fields"><div><label>Nom</label><input name="nom" required></div><div><label>Email</label><input name="email" type="email" required></div><div><label>Mot de passe (8 caractères minimum)</label><input name="password" type="password" minlength="8" required></div><div><label>Rôle</label><select name="role"><option value="utilisateur">Utilisateur</option><option value="administrateur">Administrateur</option></select></div></div><button>Créer le compte</button></form></div>${listPanel("Utilisateurs",rows,["nom","email","role","actif"],"utilisateurs")}`;return}
 }catch(e){v.innerHTML=`<div class="panel error">${esc(e.message)}</div>`}}
function table(rows,cols){if(!rows?.length)return `<p class="muted">Aucune donnée enregistrée.</p>`;return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function listPanel(title,rows,cols,resource){return `<div class="panel"><div class="toolbar"><h2>${title}</h2><span class="muted">${rows.length} enregistrement(s)</span></div>${table(rows,cols)}${isAdmin()?`<p class="muted">La modification et la suppression sont réservées à l'administrateur. Les écritures d'historique sont conservées.</p>`:""}</div>`}
function productForm(){return `<form onsubmit="submitForm(event,'produits')"><div class="fields"><div><label>Référence</label><input name="reference"></div><div><label>Nom du produit</label><input name="nom" required></div><div><label>Catégorie</label><input name="categorie"></div><div><label>Dépôt</label><select name="depot"><option value="">Choisir</option>${state.depots.map(d=>`<option>${esc(d.nom)}</option>`).join("")}</select></div><div><label>Stock initial</label><input name="quantite_stock" type="number" min="0" step="0.01" value="0"></div><div><label>Stock minimum</label><input name="stock_minimum" type="number" min="0" step="0.01" value="0"></div><div><label>Unité</label><input name="unite" value="unité"></div></div><button>Enregistrer le produit</button></form>`}
function simpleForm(resource,fields){return `<form onsubmit="submitForm(event,'${resource}')"><div class="fields">${fields.map(f=>`<div><label>${f}</label><input name="${f}" ${f==="nom"?"required":""}></div>`).join("")}</div><button>Enregistrer</button></form>`}
function entryForm(){return `<form onsubmit="submitForm(event,'entrees')"><div class="fields"><div><label>Date</label><input name="date_entree" type="date" value="${today()}" required></div><div><label>Produit</label><select name="produit_id" required>${options(state.products)}</select></div><div><label>Référence / Facture</label><input name="reference_document"></div><div><label>Dépôt</label><select name="depot"><option value="">Choisir</option>${state.depots.map(d=>`<option>${esc(d.nom)}</option>`).join("")}</select></div><div><label>Quantité reçue</label><input name="quantite" type="number" min="0.01" step="0.01" required></div><div><label>Fournisseur</label><input name="fournisseur"></div><div><label>Date d'expiration</label><input name="date_expiration" type="date"></div><div><label>Observations</label><input name="observations"></div></div><button>Enregistrer l'entrée</button></form>`}
function exitForm(){return `<form onsubmit="submitForm(event,'sorties')"><div class="fields"><div><label>Date</label><input name="date_sortie" type="date" value="${today()}" required></div><div><label>Produit</label><select name="produit_id" required>${options(state.products)}</select></div><div><label>N° Facture</label><input name="numero_facture"></div><div><label>Quantité sur facture</label><input name="quantite" id="qfact" type="number" min="0.01" step="0.01" required oninput="calcBalance()"></div><div><label>Avance (quantité qui sort du stock)</label><input name="avance" id="avance" type="number" min="0" step="0.01" required oninput="calcBalance()"></div><div><label>Balance calculée</label><input id="balance" readonly></div><div><label>Client / Destinataire</label><input name="client_destinataire"></div><div><label>Dépôt</label><select name="depot"><option value="">Choisir</option>${state.depots.map(d=>`<option>${esc(d.nom)}</option>`).join("")}</select></div><div><label>Chauffeur</label><input name="chauffeur"></div><div><label>Plaque</label><input name="plaque"></div><div><label>N° Bon de livraison</label><input name="numero_bon_livraison"></div><div><label>Téléphone chauffeur</label><input name="telephone_chauffeur"></div><div><label>Observations</label><input name="observations"></div></div><p class="muted">La quantité qui diminue le stock est l'avance. Balance = quantité sur facture − avance.</p><button>Enregistrer la sortie</button></form>`}
function calcBalance(){const q=Number(document.getElementById("qfact")?.value||0),a=Number(document.getElementById("avance")?.value||0);const b=document.getElementById("balance");if(b)b.value=(q-a).toString()}
async function submitForm(e,resource){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api(resource,{method:"POST",body:JSON.stringify(data)});msg("Enregistrement effectué.",true);await refreshBasics();await page(state.resource)}catch(err){msg(err.message)}}
document.getElementById("loginForm").addEventListener("submit",login);
(async()=>{try{const d=await api("me");state.user=d.user;await startApp()}catch{}})();
</script></body></html>
